name: aiops-comment-assistant

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${AIOPS_MYSQL_DATABASE:-aiops}
      MYSQL_ROOT_PASSWORD: ${AIOPS_MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${AIOPS_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      AIOPS_REDIS_PASSWORD: ${AIOPS_REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        if [ -n "$${AIOPS_REDIS_PASSWORD}" ]; then
          exec redis-server --appendonly yes --requirepass "$${AIOPS_REDIS_PASSWORD}";
        else
          exec redis-server --appendonly yes;
        fi
    ports:
      - "${AIOPS_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${AIOPS_REDIS_PASSWORD}\" ]; then redis-cli -a \"$${AIOPS_REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 10

  python-service:
    build:
      context: ./aiops-python-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${AIOPS_MYSQL_DATABASE:-aiops}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${AIOPS_MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ${AIOPS_REDIS_PASSWORD:-}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_CHAT_PATH: ${AI_CHAT_PATH:-/v1/chat/completions}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      AI_TIMEOUT: ${AI_TIMEOUT:-60}
      AI_TEXT_STREAMING_ENABLED: ${AI_TEXT_STREAMING_ENABLED:-false}
      AI_NEGATIVE_REPLY_ENGINE: ${AI_NEGATIVE_REPLY_ENGINE:-langchain}
      AI_NEGATIVE_REPLY_THINKING_ENABLED: ${AI_NEGATIVE_REPLY_THINKING_ENABLED:-false}
      AI_NEGATIVE_REPLY_MAX_TOKENS: ${AI_NEGATIVE_REPLY_MAX_TOKENS:-320}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      COMMENT_AI_SHADOW_DEFAULT_SAMPLE_SIZE: ${COMMENT_AI_SHADOW_DEFAULT_SAMPLE_SIZE:-60}
      COMMENT_AI_SHADOW_MAX_SAMPLE_SIZE: ${COMMENT_AI_SHADOW_MAX_SAMPLE_SIZE:-100}
      COMMENT_AI_SHADOW_DEFAULT_MAX_TOTAL_TOKENS: ${COMMENT_AI_SHADOW_DEFAULT_MAX_TOTAL_TOKENS:-60000}
      COMMENT_AI_SHADOW_MAX_TOTAL_TOKENS: ${COMMENT_AI_SHADOW_MAX_TOTAL_TOKENS:-100000}
      COMMENT_AI_MODE: ${COMMENT_AI_MODE:-rule}
      COMMENT_AI_HYBRID_MIN_CONFIDENCE: ${COMMENT_AI_HYBRID_MIN_CONFIDENCE:-0.80}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_COLLECTION: ${RAG_COLLECTION:-aiops_knowledge_v1}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_MIN_RELEVANCE_SCORE: ${RAG_MIN_RELEVANCE_SCORE:-0.35}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-6000}
      RAG_REPLY_TOP_K: ${RAG_REPLY_TOP_K:-2}
      RAG_REPLY_MAX_CONTEXT_CHARS: ${RAG_REPLY_MAX_CONTEXT_CHARS:-1800}
      RAG_REVIEW_EVIDENCE_MAX_DOCUMENTS: ${RAG_REVIEW_EVIDENCE_MAX_DOCUMENTS:-2000}
      RAG_CHROMA_DIR: /data/rag/chroma
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      HF_HOME: /data/rag/huggingface
      LOCAL_IMPORT_HOST_PATH: ${AIOPS_LOCAL_IMPORT_HOST_PATH:-}
      LOCAL_IMPORT_CONTAINER_PATH: /data/local-import
      CRAWLER_ENABLED: ${CRAWLER_ENABLED:-false}
    volumes:
      - rag-data:/data/rag
      - type: bind
        source: ${AIOPS_LOCAL_IMPORT_HOST_PATH:-./data}
        target: /data/local-import
        read_only: true
    ports:
      - "${AIOPS_PYTHON_PORT:-8001}:8001"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./aiops-backend
    restart: unless-stopped
    environment:
      AIOPS_MYSQL_HOST: mysql
      AIOPS_MYSQL_PORT: 3306
      AIOPS_MYSQL_DATABASE: ${AIOPS_MYSQL_DATABASE:-aiops}
      AIOPS_MYSQL_USERNAME: root
      AIOPS_MYSQL_PASSWORD: ${AIOPS_MYSQL_PASSWORD}
      AIOPS_REDIS_HOST: redis
      AIOPS_REDIS_PORT: 6379
      AIOPS_REDIS_PASSWORD: ${AIOPS_REDIS_PASSWORD:-}
      AIOPS_PYTHON_BASE_URL: http://python-service:8001
      AIOPS_JWT_SECRET: ${AIOPS_JWT_SECRET}
      AIOPS_AI_JOB_CORE_POOL_SIZE: ${AIOPS_AI_JOB_CORE_POOL_SIZE:-2}
      AIOPS_AI_JOB_MAX_POOL_SIZE: ${AIOPS_AI_JOB_MAX_POOL_SIZE:-4}
      AIOPS_AI_JOB_QUEUE_CAPACITY: ${AIOPS_AI_JOB_QUEUE_CAPACITY:-100}
      AIOPS_AI_JOB_GLOBAL_CONCURRENCY: ${AIOPS_AI_JOB_GLOBAL_CONCURRENCY:-4}
      AIOPS_AI_JOB_PER_USER_CONCURRENCY: ${AIOPS_AI_JOB_PER_USER_CONCURRENCY:-2}
      AIOPS_AI_JOB_LEASE_SECONDS: ${AIOPS_AI_JOB_LEASE_SECONDS:-45}
      AIOPS_AI_JOB_HEARTBEAT_SECONDS: ${AIOPS_AI_JOB_HEARTBEAT_SECONDS:-15}
      AIOPS_AI_JOB_TIMEOUT_SECONDS: ${AIOPS_AI_JOB_TIMEOUT_SECONDS:-120}
      AIOPS_AI_JOB_RECOVERY_ENABLED: ${AIOPS_AI_JOB_RECOVERY_ENABLED:-true}
      AIOPS_AI_JOB_RECOVERY_INTERVAL_SECONDS: ${AIOPS_AI_JOB_RECOVERY_INTERVAL_SECONDS:-60}
      COMMENT_AI_MODE: ${COMMENT_AI_MODE:-rule}
      COMMENT_AI_HYBRID_MIN_CONFIDENCE: ${COMMENT_AI_HYBRID_MIN_CONFIDENCE:-0.80}
      COMMENT_AI_HYBRID_MIN_ANNOTATED: ${COMMENT_AI_HYBRID_MIN_ANNOTATED:-50}
      COMMENT_AI_HYBRID_MIN_ANNOTATION_COVERAGE: ${COMMENT_AI_HYBRID_MIN_ANNOTATION_COVERAGE:-0.80}
      COMMENT_AI_HYBRID_MIN_CALL_SUCCESS_RATE: ${COMMENT_AI_HYBRID_MIN_CALL_SUCCESS_RATE:-0.95}
      COMMENT_AI_HYBRID_MIN_JSON_VALID_RATE: ${COMMENT_AI_HYBRID_MIN_JSON_VALID_RATE:-0.98}
      COMMENT_AI_HYBRID_MIN_EVIDENCE_VALID_RATE: ${COMMENT_AI_HYBRID_MIN_EVIDENCE_VALID_RATE:-0.98}
      COMMENT_AI_HYBRID_MAX_SENTIMENT_ACCURACY_DROP: ${COMMENT_AI_HYBRID_MAX_SENTIMENT_ACCURACY_DROP:-0.02}
      COMMENT_AI_HYBRID_MIN_PROBLEM_MICRO_F1_GAIN: ${COMMENT_AI_HYBRID_MIN_PROBLEM_MICRO_F1_GAIN:-0.05}
      AIOPS_PDF_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc,0
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-https://oss-cn-beijing.aliyuncs.com}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME:-your-bucket-name}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-your-access-key-id}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-your-access-key-secret}
    ports:
      - "${AIOPS_BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/doc.html"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  frontend:
    build:
      context: ./aiops-frontend
    restart: unless-stopped
    ports:
      - "${AIOPS_FRONTEND_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql-data:
  redis-data:
  rag-data:
