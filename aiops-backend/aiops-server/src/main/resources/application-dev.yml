spring:
  config:
    import:
      - optional:file:./application-secret.yml
      - optional:file:../application-secret.yml
      - optional:file:./aiops-backend/application-secret.yml
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql

aiops:
  config:
    datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      host: ${AIOPS_MYSQL_HOST:localhost}
      port: ${AIOPS_MYSQL_PORT:3306}
      database: ${AIOPS_MYSQL_DATABASE:aiops}
      username: ${AIOPS_MYSQL_USERNAME:root}
      password: ${AIOPS_MYSQL_PASSWORD:}
    redis:
      host: ${AIOPS_REDIS_HOST:localhost}
      port: ${AIOPS_REDIS_PORT:6379}
      database: ${AIOPS_REDIS_DATABASE:0}
      timeout: 3s
      password: ${AIOPS_REDIS_PASSWORD:}
    multipart:
      max-file-size: 200MB
      max-request-size: 250MB
    jwt:
      secret: ${AIOPS_JWT_SECRET:change-me-dev-jwt-secret}
      expire-seconds: 86400
    python:
      base-url: ${AIOPS_PYTHON_BASE_URL:http://localhost:8001}
      connect-timeout-seconds: 5
      read-timeout-seconds: 300
    pdf:
      font-path: ${AIOPS_PDF_FONT_PATH:}
    ai-rate-limit:
      enabled: true
      capacity: 20
      refill-tokens: 20
      refill-period-seconds: 60
    comment-ai-hybrid:
      mode: ${COMMENT_AI_MODE:rule}
      min-confidence: ${COMMENT_AI_HYBRID_MIN_CONFIDENCE:0.80}
      min-annotated: ${COMMENT_AI_HYBRID_MIN_ANNOTATED:50}
      min-annotation-coverage: ${COMMENT_AI_HYBRID_MIN_ANNOTATION_COVERAGE:0.80}
      min-call-success-rate: ${COMMENT_AI_HYBRID_MIN_CALL_SUCCESS_RATE:0.95}
      min-json-valid-rate: ${COMMENT_AI_HYBRID_MIN_JSON_VALID_RATE:0.98}
      min-evidence-valid-rate: ${COMMENT_AI_HYBRID_MIN_EVIDENCE_VALID_RATE:0.98}
      max-sentiment-accuracy-drop: ${COMMENT_AI_HYBRID_MAX_SENTIMENT_ACCURACY_DROP:0.02}
      min-problem-micro-f1-gain: ${COMMENT_AI_HYBRID_MIN_PROBLEM_MICRO_F1_GAIN:0.05}
    task-maintenance:
      enabled: true
      interval-seconds: 300
      stale-processing-minutes: 30
      lock-wait-seconds: 1
      lock-lease-seconds: 60
    aliyun:
      oss:
        endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
        bucket-name: ${ALIYUN_OSS_BUCKET_NAME:your-bucket-name}
        access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:your-access-key-id}
        access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:your-access-key-secret}
        upload-dir: ${ALIYUN_OSS_UPLOAD_DIR:aiops/csv}
        signed-url-expire-seconds: ${ALIYUN_OSS_SIGNED_URL_EXPIRE_SECONDS:3600}
